name: Terraform provider schema verification (no Azure credentials)
on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/terraform_provider_preflight.py'
      - 'tests/test_terraform_provider_preflight.py'
      - 'scripts/verify_terraform_lock_consistency.py'
      - 'tests/test_terraform_lock_consistency.py'
      - '.github/workflows/terraform-provider-schema-real.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/terraform_provider_preflight.py'
      - 'tests/test_terraform_provider_preflight.py'
      - 'scripts/verify_terraform_lock_consistency.py'
      - 'tests/test_terraform_lock_consistency.py'
      - '.github/workflows/terraform-provider-schema-real.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
concurrency:
  group: terraform-provider-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Offline source and pinned lockfile preflight (not provider verification)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/terraform_provider_preflight.py
          python3 scripts/verify_terraform_lock_consistency.py
      - name: Offline preflight and lockfile mutation regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p 'test_terraform_provider_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_terraform_lock_consistency.py' -v

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3 tag
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Terraform formatting (read-only to repository)
        run: terraform fmt -check -diff -recursive infra

  provider-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3 tag
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Record original Terraform version and pinned lockfile hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          terraform version | tee artifacts/terraform-version.txt
          python3 scripts/verify_terraform_lock_consistency.py > artifacts/lock-preflight.json
          sha256sum infra/bootstrap/.terraform.lock.hcl infra/environments/dev/.terraform.lock.hcl | tee artifacts/lock-before.txt
      - name: Verify original HCL formatting without rewriting the checkout
        run: terraform fmt -check -diff -recursive infra
      - name: Initialize Bootstrap providers (NO backend, NO Azure)
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/bootstrap init -backend=false -lockfile=readonly -input=false -no-color | tee artifacts/bootstrap-init.log
      - name: Validate Bootstrap with real AzureRM schema
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/bootstrap validate -no-color | tee artifacts/bootstrap-validate.log
      - name: Initialize DEV providers (NO backend, NO Azure)
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/environments/dev init -backend=false -lockfile=readonly -input=false -no-color | tee artifacts/dev-init.log
      - name: Validate DEV with real AzureRM schema
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/environments/dev validate -no-color | tee artifacts/dev-validate.log
      - name: Confirm lockfiles and tracked HCL unchanged after actual provider validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_terraform_lock_consistency.py > artifacts/lock-postflight.json
          sha256sum infra/bootstrap/.terraform.lock.hcl infra/environments/dev/.terraform.lock.hcl | tee artifacts/lock-after.txt
          diff -u artifacts/lock-before.txt artifacts/lock-after.txt
          git diff --exit-code -- infra
      - name: Record sanitized provider lock digests (not Azure acceptance)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          for name in infra/bootstrap infra/environments/dev; do
            if [[ -f "$name/.terraform.lock.hcl" ]]; then
              sha256sum "$name/.terraform.lock.hcl" | tee -a artifacts/provider-lockfile-digests.txt
            fi
          done
          printf 'Azure plan/apply NOT EXECUTED; live PASS 0; NO-GO\n' > artifacts/assurance-scope.txt
      - name: Review offline artifact bytes and create sanitized upload snapshot
        id: artifact_safety
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_offline_ci_artifacts.py --workflow terraform-provider-schema-real.yml --root artifacts --stage artifacts-reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.artifact_safety.outcome == 'success' }}
        with:
          name: terraform-provider-schema-evidence
          path: artifacts-reviewed/
          if-no-files-found: ignore
          retention-days: 14