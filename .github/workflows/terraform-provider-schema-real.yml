name: Terraform provider schema verification (no Azure credentials)
on:
  push:
    paths:
      - 'infra/**'
      - 'scripts/terraform_provider_preflight.py'
      - 'tests/test_terraform_provider_preflight.py'
      - '.github/workflows/terraform-provider-schema-real.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/terraform_provider_preflight.py'
      - 'tests/test_terraform_provider_preflight.py'
      - '.github/workflows/terraform-provider-schema-real.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terraform-provider-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check source and report missing lockfile gates
        run: python3 scripts/terraform_provider_preflight.py
      - name: Offline preflight mutation tests
        run: python3 -m unittest discover -s tests -p 'test_terraform_provider_preflight.py' -v

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Terraform formatting (read-only to repository)
        run: terraform fmt -check -diff -recursive infra

  provider-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Version and ephemeral format-normalization
        run: |
          mkdir -p artifacts
          terraform version | tee artifacts/terraform-version.txt
          terraform fmt -recursive infra
          git diff -- infra > artifacts/terraform-fmt.patch || true
      - name: Initialize Bootstrap providers (NO backend, NO Azure)
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/bootstrap init -backend=false -input=false -no-color | tee artifacts/bootstrap-init.log
      - name: Validate Bootstrap with real AzureRM schema
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/bootstrap validate -no-color | tee artifacts/bootstrap-validate.log
      - name: Initialize DEV providers (NO backend, NO Azure)
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/environments/dev init -backend=false -input=false -no-color | tee artifacts/dev-init.log
      - name: Validate DEV with real AzureRM schema
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform -chdir=infra/environments/dev validate -no-color | tee artifacts/dev-validate.log
      - name: Record generated provider lockfile digests (not approval)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in infra/bootstrap infra/environments/dev; do
            if [[ -f "$name/.terraform.lock.hcl" ]]; then
              echo "$name"
              sha256sum "$name/.terraform.lock.hcl" | tee -a artifacts/generated-lockfile-digests.txt
              cp "$name/.terraform.lock.hcl" "artifacts/$(echo "$name" | tr / -)-terraform.lock.hcl"
            fi
          done
          printf 'Azure plan/apply NOT EXECUTED; live PASS 0; NO-GO\n' > artifacts/assurance-scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-provider-schema-evidence
          path: artifacts/
          retention-days: 14