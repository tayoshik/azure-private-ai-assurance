name: English catalogue publication integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Offline publication verification
        run: python3 scripts/verify_publication.py
      - name: Regression unit tests
        run: python3 -m unittest discover -s tests -p 'test_publication*.py' -v
