name: P1 ten evidence correlations (offline, untrusted)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/review_p1_evidence_correlation.py'
      - 'tests/test_p1_evidence_correlation.py'
      - 'docs/p1-evidence-correlation-ten.md'
      - '.github/workflows/p1-evidence-correlation.yml'
  pull_request:
    paths:
      - 'scripts/review_p1_evidence_correlation.py'
      - 'tests/test_p1_evidence_correlation.py'
      - 'docs/p1-evidence-correlation-ten.md'
      - '.github/workflows/p1-evidence-correlation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  untrusted-evidence-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Ten source-linked cases, negative and tamper regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p 'test_p1_evidence_correlation.py' -v
          python3 -m unittest discover -s tests -p 'test_static_criteria_review.py' -v
      - name: Original 160 ranking remains source-grounded and 1716 catalogue intact
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python3 scripts/triage_static_criteria.py --out artifacts/static-160-priority.json > /tmp/priority.json
          python3 scripts/build_test_automation_ledger.py --check
          python3 scripts/audit_catalogue_dependencies.py > artifacts/dependency.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/priority.json',encoding='utf-8'))
          d=json.load(open('artifacts/dependency.json',encoding='utf-8'))
          selected={'AZ-T19-03','AZ-T39-19','AZ-T43-15','AZ-T48-19',
                    'AZ-T50-15','AZ-T50-17','AZ-T51-19','AZ-T53-09',
                    'AZ-T55-15','AZ-T58-09'}
          candidates={r['id']:r for r in p['cases']}
          assert len(selected)==10 and len(candidates)==160
          assert all(candidates[k]['priority']=='P1' and
                     candidates[k]['semantic_risk']=='EVIDENCE' for k in selected)
          assert p['priority_counts']=={'P0':5,'P1':127,'P2':28}
          assert p['errors']==[] and p['live_azure_acceptances']==0
          assert d['canonical_test_ids']==1716 and not d['errors']
          assert d['literal_script_reference']['MISSING_SCRIPT_REFERENCE']==13
          assert d['literal_script_reference']['TRACKED_SCRIPT_REFERENCE']==986
          assert d['literal_script_reference']['NO_DIRECT_SCRIPT_REFERENCE']==717
          assert d['cases_with_missing_input']==0
          assert d['azure_live_passes_verified']==0 and d['release_decision']=='NO_GO'
          PY
      - name: Release gate must deny, strict semantic inventory must deny
        shell: bash
        run: |
          set -Eeuo pipefail
          rc=0
          python3 scripts/audit_semantic_readiness.py --strict --out artifacts/semantic-summary.json > /dev/null || rc=$?
          test "$rc" -eq 2
          rc=0
          python3 scripts/release_gate.py > artifacts/release.json || rc=$?
          test "$rc" -eq 2
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/release.json',encoding='utf-8'))
          assert r['decision']=='NO_GO' and r['verified_live_azure_passes']==0
          PY
      - name: Review offline artifact bytes and create sanitized upload snapshot
        id: artifact_safety
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_offline_ci_artifacts.py --workflow p1-evidence-correlation.yml --root artifacts --stage artifacts-reviewed
      - name: Upload sanitized offline status only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.artifact_safety.outcome == 'success' }}
        with:
          name: p1-ten-evidence-offline-audit
          path: artifacts-reviewed/
          retention-days: 14
          if-no-files-found: ignore
