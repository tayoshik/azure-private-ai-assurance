name: Prioritize 160 static check semantics (offline only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/triage_static_criteria.py'
      - 'scripts/review_high_risk_static.py'
      - 'tests/test_static_criteria_review.py'
      - 'docs/static-criteria-review-160.md'
      - '.github/workflows/static-criteria-review.yml'
  pull_request:
    paths:
      - 'scripts/triage_static_criteria.py'
      - 'scripts/review_high_risk_static.py'
      - 'tests/test_static_criteria_review.py'
      - 'docs/static-criteria-review-160.md'
      - '.github/workflows/static-criteria-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-static-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Validate all 160 source IDs and five concrete semantic traps
        run: |
          python3 -m unittest discover -s tests -p 'test_static_criteria_review.py' -v
          python3 -m unittest discover -s tests -p 'test_semantic_readiness.py' -v
      - name: Export ranked 160-case review queue, never test execution
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python3 scripts/triage_static_criteria.py --out artifacts/ranked-static-criteria-160.json > artifacts/static-summary.json
          python3 - <<'PY'
          import json
          with open('artifacts/static-summary.json',encoding='utf-8') as f: x=json.load(f)
          assert x['catalogue_test_ids'] == 1716 and x['static_review_candidates'] == 160
          assert not x['errors']
          assert sum(x['priority_counts'].values()) == 160
          assert [r['id'] for r in x['cases'][:5]] == x['first_five_critical_ids']
          assert x['live_azure_acceptances'] == 0 and x['release_decision'] == 'NO_GO'
          assert all(not r['independent_approval_verified'] and r['azure_acceptance']=='NOT_READY' for r in x['cases'])
          print('Static cases prioritized:',x['priority_counts'])
          PY
      - name: Strict review and release decision must both fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          rc=0
          python3 scripts/triage_static_criteria.py --summary --strict > /dev/null || rc=$?
          test "$rc" -eq 2
          python3 scripts/build_test_automation_ledger.py --check
          python3 scripts/audit_catalogue_dependencies.py > artifacts/dependency-audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('artifacts/dependency-audit.json',encoding='utf-8'))
          assert d['canonical_test_ids']==1716 and d['errors']==[]
          assert d['literal_script_reference']['MISSING_SCRIPT_REFERENCE']==13
          assert d['literal_script_reference']['TRACKED_SCRIPT_REFERENCE']==986
          assert d['literal_script_reference']['NO_DIRECT_SCRIPT_REFERENCE']==717
          assert d['cases_with_missing_input']==0
          assert d['azure_live_passes_verified']==0
          PY
          rc=0
          python3 scripts/release_gate.py > artifacts/release.json || rc=$?
          test "$rc" -eq 2
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/release.json',encoding='utf-8'))
          assert r['decision']=='NO_GO' and r['verified_live_azure_passes']==0
          PY
      - name: Upload sanitized review queue (not live evidence)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-criteria-160-review-only
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
