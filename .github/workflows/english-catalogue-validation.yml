name: English catalogue consistency
on:
  push:
    paths:
      - 'docs/phase1-220-english-tests.md'
      - 'docs/phase2-220-english-tests.md'
      - 'specs/english_tests_001_440.json'
      - 'scripts/verify_english_tests.py'
      - '.github/workflows/english-catalogue-validation.yml'
  pull_request:
    paths:
      - 'docs/phase1-220-english-tests.md'
      - 'docs/phase2-220-english-tests.md'
      - 'specs/english_tests_001_440.json'
      - 'scripts/verify_english_tests.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate English test catalogue (offline only)
        run: python3 scripts/verify_english_tests.py
